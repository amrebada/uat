<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>UAT</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2c46"/>
      <stop offset="1" stop-color="#0c111b"/>
    </linearGradient>
    <linearGradient id="trace" x1="294" y1="0" x2="730" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a6cf0"/>
      <stop offset="1" stop-color="#82abff"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="530" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a6cf0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#3a6cf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse" x="6" y="6">
      <circle cx="22" cy="22" r="3" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- The tile, with the app's dotted canvas -->
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000000" fill-opacity="0.32" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- The rest of the stack: services the call didn't go to -->
  <g stroke="#3f5378" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M294 529 L322 300"/>
    <path d="M439 674 L664 770"/>
    <path d="M730 360 L586 236"/>
  </g>
  <g fill="#3f5378">
    <circle cx="322" cy="300" r="27"/>
    <circle cx="664" cy="770" r="27"/>
    <circle cx="586" cy="236" r="27"/>
  </g>

  <!-- The call, through three services: accepted -->
  <path d="M294 529 L439 674 L730 360" fill="none" stroke="#3a6cf0" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" filter="url(#blur)"/>
  <path d="M294 529 L439 674 L730 360" fill="none" stroke="url(#trace)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff">
    <circle cx="294" cy="529" r="50"/>
    <circle cx="439" cy="674" r="50"/>
    <circle cx="730" cy="360" r="50"/>
  </g>
  <g fill="#2f66e8">
    <circle cx="294" cy="529" r="18"/>
    <circle cx="439" cy="674" r="18"/>
    <circle cx="730" cy="360" r="18"/>
  </g>
</svg>
